name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/osr.py ledger-verify
      - run: python scripts/osr.py plan-check
  required:
    name: ci-required
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a successful complete test matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          python -c "import os; result = os.environ['MATRIX_RESULT']; print('Matrix result:', result); raise SystemExit(0 if result == 'success' else 1)"
